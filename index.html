
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STEM Robotics Presentation Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 0; 
      overscroll-behavior: none;
      background-color: #020617;
      color: #f8fafc;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .slide-aspect { aspect-ratio: 16 / 9; }
    
    .editor-grid {
      background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
      background-size: 40px 40px;
    }

    /* Cinematic Background Animations */
    .anim-bg-pulse { animation: pulse-slow 10s ease-in-out infinite; will-change: transform, opacity; }
    .anim-bg-float { animation: float-slow 15s ease-in-out infinite; will-change: transform; }
    .anim-bg-zoom-slow { animation: zoom-slow 25s ease-in-out infinite; will-change: transform; }
    .anim-bg-pan-slow { animation: pan-slow 40s linear infinite; will-change: background-position; }
    .anim-bg-spin-slow { animation: spin-slow 80s linear infinite; will-change: transform; }

    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(0.5deg); }
    }
    @keyframes zoom-slow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes pan-slow {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg) scale(1.5); }
      to { transform: rotate(360deg) scale(1.5); }
    }

    @media print {
      @page { size: landscape; margin: 0; }
      .no-print { display: none !important; }
      .print-slide { width: 100vw; height: 56.25vw; page-break-after: always; position: relative; overflow: hidden; }
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    
    .text-reveal { animation: textReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    @keyframes textReveal { 
      from { opacity: 0; transform: translateY(30px); filter: blur(10px); } 
      to { opacity: 1; transform: translateY(0); filter: blur(0); } 
    }

    .hljs { background: transparent !important; padding: 0 !important; }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react": "https://esm.sh/react@^19.2.3",
    "highlight.js": "https://esm.sh/highlight.js@^11.9.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden">
  <div id="root"></div>
</body>
</html>
